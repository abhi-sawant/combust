<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combust — Highlighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fcfcf9; --ink:#10100d; --muted:#6a6a62; --faint:#a4a49a; --rule:#10100d; --hair:#dedfd6;
  --mark:#d6ff3d; --mark-ink:#10100d; --hover:#f2f3ea; --sel:#d6ff3d;
  --warn:#6b4a00; --warn-bg:#fff0c4; --bad:#b3261e;
  --f:'Schibsted Grotesk',system-ui,sans-serif; --ease:cubic-bezier(.22,1,.36,1);
}
:root[data-theme=dark]{
  --bg:#0a0a09; --ink:#f3f3ec; --muted:#9a9a90; --faint:#5b5b54; --rule:#f3f3ec; --hair:#262622;
  --mark:#cdf53a; --mark-ink:#0a0a09; --hover:#141412; --sel:#cdf53a;
  --warn:#f3cd6e; --warn-bg:#2a2108; --bad:#ff8f84; color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
body{font:400 15px/1.5 var(--f);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:'tnum';min-height:100svh}
::selection{background:var(--sel);color:#10100d}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:18px;height:18px;flex:none}
*{scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
.wrap{max-width:1120px;margin:0 auto;padding:0 40px}

/* marker */
.mk{background:linear-gradient(transparent 14%,var(--mark) 14% 92%,transparent 92%);background-size:0% 100%;background-repeat:no-repeat;color:var(--mark-ink);padding:0 .08em;margin:0 -.08em;animation:swipe .9s .15s var(--ease) forwards;border-radius:.06em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.mk.now{background-size:100% 100%;animation:none}
@keyframes swipe{to{background-size:100% 100%}}

header{border-bottom:1px solid var(--rule)}
.hd{display:flex;align-items:center;gap:36px;height:64px}
.word{font:800 20px var(--f);letter-spacing:-.04em;display:flex;align-items:center;gap:8px}
.word i{width:10px;height:10px;background:var(--mark);border:1.5px solid var(--ink);border-radius:50%}
.nav{display:flex;gap:26px;height:100%}
.nav button{position:relative;height:100%;font-weight:500;color:var(--muted);transition:color .2s}
.nav button:hover{color:var(--ink)}
.nav button[aria-current=page]{color:var(--ink);font-weight:700}
.nav button[aria-current=page]::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:4px;background:var(--mark);border-top:1.5px solid var(--ink)}
.nav button[aria-disabled=true]{opacity:.45;cursor:default}
.sp{flex:1}
.veh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.veh small{font-weight:400;color:var(--muted);font-size:13px}
.veh svg{width:15px;height:15px;color:var(--muted)}
.icon{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.icon:hover{color:var(--ink);background:var(--hover)}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;border-radius:999px;transition:background .2s,color .2s,transform .2s var(--ease)}
.btn:hover{background:var(--mark);color:var(--mark-ink)}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;stroke-width:2.4}
.btn.line{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)}
.btn.line:hover{box-shadow:inset 0 0 0 1px var(--ink);background:none;color:var(--ink)}
main{padding:56px 0 96px}

/* overview */
.intro{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;align-items:end}
.lbl{font-size:14px;font-weight:600;margin-bottom:6px}
.num{font:800 clamp(84px,17vw,96px)/.9 var(--f);letter-spacing:-.045em;display:flex;align-items:baseline;gap:12px}
.num .mk{padding:0 .1em 0 .06em}
.num small{font:600 22px var(--f);letter-spacing:-.01em;color:var(--muted)}
.lede{font:600 clamp(24px,3vw,32px)/1.18 var(--f);letter-spacing:-.025em;max-width:22ch;text-wrap:balance}
.lede span{color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);margin-top:48px;border-top:1px solid var(--rule)}
.strip div{padding:16px 24px 0 0}
.strip div+div{padding-left:24px;border-left:1px solid var(--hair)}
.strip dt{font-size:13px;color:var(--muted)}
.strip dd{font:700 32px/1.15 var(--f);letter-spacing:-.03em;margin-top:2px}
.strip dd small{font:500 14px var(--f);color:var(--faint);margin-left:4px;letter-spacing:0}

.two{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:56px;margin-top:64px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:1px solid var(--rule)}
h2{font:700 18px var(--f);letter-spacing:-.02em}
.link{font-size:14px;font-weight:500;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;text-decoration-color:var(--mark)}
.link:hover{text-decoration-color:var(--ink)}
.hb{position:relative;padding-top:6px}
.hbrow{display:grid;grid-template-columns:48px 1fr 46px;align-items:center;gap:14px;height:34px;font-size:13px}
.hbrow .d{color:var(--muted)}
.hbrow .t{height:10px;position:relative}
.hbrow .f{height:100%;width:var(--w);background:var(--faint);transform-origin:left;animation:run .9s var(--ease) both;animation-delay:calc(var(--i)*40ms)}
.hbrow.up .f{background:var(--ink)}
.hbrow.best .f{background:var(--mark);box-shadow:inset 0 0 0 1.5px var(--ink)}
.hbrow .v{text-align:right;font-weight:700}
.hbrow:not(.up):not(.best) .v{font-weight:500;color:var(--muted)}
.hbrow:hover .f{outline:1.5px solid var(--ink);outline-offset:2px}
@keyframes run{from{transform:scaleX(.01)}}
.avg{position:absolute;top:0;bottom:0;left:calc(62px + (100% - 62px - 60px) * var(--a));border-left:1.5px dashed var(--ink);pointer-events:none}
.avg b{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font:600 11px var(--f);white-space:nowrap;background:var(--bg);padding:0 4px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}

.rows{list-style:none;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--hair);transition:background .15s}
.row .s{font-weight:600}
.row .sub{font-size:13px;color:var(--muted)}
.row .m{text-align:right;font:700 24px/1 var(--f);letter-spacing:-.03em}
.row .m small{display:block;font:400 12px var(--f);color:var(--faint);margin-top:4px;letter-spacing:0}
.dwn{color:var(--muted);font-weight:500!important}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font:500 12.5px var(--f);box-shadow:inset 0 0 0 1px var(--faint);color:var(--muted)}
.tag.pending{box-shadow:none;border:1px dashed var(--faint)}
.tag.warn{background:var(--warn-bg);color:var(--warn);box-shadow:none}

/* entries */
.page-h{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;padding-bottom:20px}
.page-h h1{font:800 clamp(48px,8vw,72px)/.95 var(--f);letter-spacing:-.05em}
.page-h p{color:var(--muted);margin-top:12px;max-width:44ch}
.ctrl{display:flex;gap:8px;align-items:center}
.grp{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;border-top:1px solid var(--rule);padding:20px 0 28px}
.grp aside{position:sticky;top:20px;align-self:start}
.grp aside h2{font:700 22px/1.1 var(--f);letter-spacing:-.03em}
.grp aside p{font-size:13px;color:var(--muted);margin-top:6px}
table{width:100%;border-collapse:collapse}
th{font:500 12px var(--f);color:var(--muted);text-align:right;padding:0 0 10px 16px}
th:first-child,td:first-child{text-align:left;padding-left:0}
th.l,td.l{text-align:left}
td{padding:14px 0 14px 16px;border-top:1px solid var(--hair);text-align:right;font-size:14px;white-space:nowrap}
tbody tr:first-child td{border-top-color:var(--ink)}
tr.e{transition:background .15s}
tr.e:hover td{background:var(--hover)}
td .mv{font:700 18px var(--f);letter-spacing:-.02em}
td.l{font-weight:600}
td.mu{color:var(--muted)}
td.act{width:78px}
.acts{display:flex;gap:2px;justify-content:flex-end;opacity:0;transition:opacity .15s}
tr.e:hover .acts,tr.e:focus-within .acts{opacity:1}
.acts button{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.acts button:hover{background:var(--bg);color:var(--ink)}
.acts svg{width:16px;height:16px}
.list-m{display:none}
.tabbar{display:none}

@media (max-width:860px){
  .wrap{padding:0 20px}
  .hd{gap:14px;height:56px}.nav,.veh small{display:none}
  .btn span{display:none}.btn{width:38px;padding:0;justify-content:center}
  main{padding:32px 0 130px}
  .intro{grid-template-columns:1fr;gap:28px}
  .strip{grid-template-columns:1fr 1fr;margin-top:36px}
  .strip div:nth-child(3){padding-left:0;border-left:0}
  .strip div:nth-child(n+3){border-top:1px solid var(--hair);margin-top:16px}
  .two{grid-template-columns:1fr;gap:48px;margin-top:48px}
  .page-h{grid-template-columns:1fr}
  .ctrl{flex-wrap:wrap}
  .grp{grid-template-columns:1fr;gap:6px;padding:16px 0 8px}
  .grp aside{position:static;display:flex;justify-content:space-between;align-items:baseline}
  .grp aside p{margin:0}
  .tbl{display:none}.list-m{display:block}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);height:calc(64px + env(safe-area-inset-bottom));align-items:center;background:var(--bg);border-top:1px solid var(--rule);z-index:10}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--muted);padding-top:8px}
  .tabbar button[aria-current=page]{color:var(--ink);font-weight:700}
  .tabbar button[aria-current=page] svg{background:var(--mark);color:var(--mark-ink);border-radius:50%;padding:0}
  .tabbar button[aria-disabled=true]{opacity:.4}
  .tabbar .add{width:48px;height:48px;border-radius:50%;margin:-14px auto 0;background:var(--mark);color:var(--mark-ink);justify-content:center;border:1.5px solid var(--ink);padding:0}
  .tabbar .add svg{width:22px;height:22px;stroke-width:2.4}
}
@media (prefers-reduced-motion:reduce){.mk{animation:none;background-size:100% 100%}.hbrow .f{animation:none}}
</style>
</head>
<body>
<header><div class="wrap hd">
  <div class="word"><i></i>combust</div>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <div class="sp"></div>
  <button class="veh" aria-label="Switch vehicle">Duke 390</button>
  <button class="icon" data-theme-btn></button>
  <button class="btn" id="addb"></button>
</div></header>
<div class="wrap"><main id="app"></main></div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<script src="shared.js"></script>
<script>
const {entries:E,stats:S,sector,f1,int,money,dshort,dfull,groups,icons:I,state}=CB;
const NAV=[['overview','Overview','gauge'],['entries','Entries','list'],['stats','Stats','bars'],['trends','Trends','trend']];
const dis=v=>v==='stats'||v==='trends'?'aria-disabled="true" title="Not part of this prototype"':'';
function shell(){
  document.getElementById('nav').innerHTML=NAV.map(([v,l])=>`<button data-go="${v}" ${state.page===v?'aria-current="page"':''} ${dis(v)}>${l}</button>`).join('');
  const tb=NAV.map(([v,l,ic])=>`<button data-go="${v}" ${state.page===v?'aria-current="page"':''} ${dis(v)}>${I[ic]}<span>${l}</span></button>`);
  tb.splice(2,0,`<button class="add" aria-label="Add fill-up">${I.plus}</button>`);
  document.getElementById('tabbar').innerHTML=tb.join('');
  document.getElementById('addb').innerHTML=`${I.plus}<span>Add fill-up</span>`;
  document.querySelector('.veh').innerHTML=`Duke 390 <small>${int(E.at(-1).odo)} km</small>${I.swap}`;
}
function mval(e){
  const s=sector(e),v=f1(e.mileage);
  return s==='best'?`<span class="mk now">${v}</span>`:s==='up'?v:`<span class="dwn">${v}</span>`;
}
function status(e){
  if(e.pending)return '<span class="tag pending">Pending</span>';
  if(e.missed)return '<span class="tag warn">Missed fill</span>';
  if(e.partial)return '<span class="tag">Partial fill</span>';
  if(e.mileage===null)return '<span style="color:var(--faint);font-weight:500">First fill</span>';
  return null;
}
function row(e){const st=status(e);
  return `<li class="row"><div><div class="s">${e.station}</div><div class="sub">${dshort(e.date)} · ${f1(e.litres)} L · ${money(e.amount)} · ${money(e.cpl)}/L</div></div>
  <div class="m">${st||mval(e)}<small>${int(e.odo)} km</small></div></li>`}
function tr(e){const st=status(e);
  return `<tr class="e"><td>${dshort(e.date)}</td><td class="mu">${int(e.odo)} km</td><td class="l">${e.station}</td><td>${f1(e.litres)}</td><td>${money(e.amount)}</td><td class="mu">${money(e.cpl)}</td><td><span class="mv">${st||mval(e)}</span></td>
  <td class="act"><div class="acts"><button aria-label="Edit entry">${I.pencil}</button><button aria-label="Delete entry">${I.trash}</button></div></td></tr>`}
const pages={
  overview(){
    const bars=E.filter(e=>e.mileage!==null).slice(-12).reverse();
    const hi=Math.ceil(S.max+1),lo=Math.floor(S.min-10);
    const w=v=>(v-lo)/(hi-lo);
    const rec=[...E].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
    return `<section class="intro" aria-label="Summary">
      <div><div class="lbl">Average mileage</div><div class="num"><span class="mk">${f1(S.avg)}</span><small>km/l</small></div></div>
      <p class="lede">The Duke 390 averages ${f1(S.avg)} km/l. <span>The last fill-up came in ${Math.abs(S.delta).toFixed(1)} ${S.delta>0?'higher':'lower'} than the one before.</span></p>
    </section>
    <dl class="strip"><div><dt>Spent</dt><dd>${money(S.spent)}</dd></div><div><dt>Distance</dt><dd>${int(S.km)}<small>km</small></dd></div><div><dt>Fuel</dt><dd>${f1(S.litres)}<small>L</small></dd></div><div><dt>Fill-ups</dt><dd>${S.count}</dd></div></dl>
    <div class="two">
      <section><div class="sec-h"><h2>Mileage by fill-up</h2></div>
        <div class="hb" style="padding-top:30px">${bars.map((e,i)=>`<div class="hbrow ${sector(e)}"><span class="d">${dshort(e.date)}</span><div class="t"><div class="f" style="--w:${(w(e.mileage)*100).toFixed(1)}%;--i:${i};width:${(w(e.mileage)*100).toFixed(1)}%"></div></div><span class="v">${f1(e.mileage)}</span></div>`).join('')}
          <div class="avg" style="--a:${w(S.avg).toFixed(3)};top:30px"><b>avg ${f1(S.avg)}</b></div></div>
        <div class="legend"><span><i style="background:var(--mark);box-shadow:inset 0 0 0 1.5px var(--ink)"></i>Best</span><span><i style="background:var(--ink)"></i>At or above average</span><span><i style="background:var(--faint)"></i>Below</span></div></section>
      <section><div class="sec-h"><h2>Recent fill-ups</h2><button class="link" data-go="entries">All entries</button></div><ol class="rows">${rec.map(row).join('')}</ol></section>
    </div>`;
  },
  entries(){
    const gs=groups();
    return `<div class="page-h"><div><h1>Entries</h1><p>${E.length} fill-ups, ${dfull(E[0].date)} to ${dfull(E.at(-1).date)}. Best so far: <span class="mk now">${f1(S.best.mileage)} km/l</span></p></div>
      <div class="ctrl"><button class="btn line">${I.upload}Import CSV</button></div></div>
    ${gs.map(g=>`<section class="grp"><aside><h2>${g.label}</h2><p>${g.items.length} ${g.items.length>1?'fill-ups':'fill-up'} · ${money(g.spent)}</p></aside>
      <div><div class="tbl"><table><thead><tr><th>Date</th><th>Odometer</th><th class="l">Station</th><th>Litres</th><th>Amount</th><th>Cost / L</th><th>Mileage</th><th></th></tr></thead><tbody>${g.items.map(tr).join('')}</tbody></table></div>
      <ol class="rows list-m">${g.items.map(row).join('')}</ol></div></section>`).join('')}`;
  }
};
function render(){document.getElementById('app').innerHTML=pages[state.page]();shell();CB.applyTheme();}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g&&g.getAttribute('aria-disabled')!=='true'){state.page=g.dataset.go;render();scrollTo(0,0);}
  const t=e.target.closest('[data-theme-btn]');if(t){state.theme=state.theme==='dark'?'light':'dark';CB.applyTheme();}
});
render();
</script>
</body>
</html>
