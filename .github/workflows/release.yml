name: Release

# Publishes a GitHub Release whenever a push to main carries a VERSION that has no tag yet.
# The /release skill bumps VERSION + web/package.json and writes the CHANGELOG section; this
# workflow builds the web zip, backend zip and signed APK, and creates the release from them.
#
# - Tag: `vX.Y.Z`, created by `gh release create` on the pushed commit (no manual tagging).
#   The Android app checks releases/latest and needs a SemVer `vX.Y.Z` tag.
# - Body: the `## X.Y.Z — date` section of CHANGELOG.md and nothing else. The Android app shows
#   the body in its update dialog (core/.../AppUpdate.kt), so it must stay the changelog.
# - Idempotent: if the tag already exists the run does nothing, so re-runs, unrelated VERSION
#   edits and several pushes in a row can never release a version twice.
#
# Secrets: ANDROID_KEYSTORE_BASE64 (base64 of android/keystore/combust.jks),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Variables (optional): VITE_API_URL, COMBUST_API_URL (both default to the production API).
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Every release must be signed by this certificate, or Android refuses to install it as an
  # update. Change it only if the signing key is deliberately replaced.
  EXPECTED_CERT_SHA256: '8a:94:f6:de:12:a4:e6:bf:95:3f:16:52:6c:52:1b:26:8c:ea:c2:32:0d:97:2c:d4:ac:fa:d5:17:91:5e:51:dd'
  DEFAULT_API_URL: 'https://api.combust.slowatcoding.com'

jobs:
  check:
    # A manual run from another branch must not publish a release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Read VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::'$version' is not X.Y.Z"
            exit 1
          fi
          pkg="$(jq -r .version web/package.json)"
          if [[ "$pkg" != "$version" ]]; then
            echo "::error file=web/package.json::version $pkg does not match VERSION $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: tag
        name: Skip if already released
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" "refs/tags/$VERSION" > /dev/null; then
            echo "Tag v$VERSION already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG section
        if: steps.tag.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Everything between `## X.Y.Z …` and the next `## ` heading, blank edges trimmed.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > changelog-section.md
          if [[ ! -s changelog-section.md ]]; then
            echo "::error file=CHANGELOG.md::no '## $VERSION — YYYY-MM-DD' section (or it is empty)"
            exit 1
          fi
          cat changelog-section.md

      - if: steps.tag.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changelog-section
          path: changelog-section.md

  web:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Includes the golden-fixture and VERSION/package.json checks.
      - run: npm test

      # web/.env is gitignored, so CI must supply VITE_API_URL (the app throws without it).
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || env.DEFAULT_API_URL }}

      # Files at the zip root (dotfiles included), ready to upload to any static host.
      - name: Zip web/dist
        run: |
          cd dist
          zip -qr "$GITHUB_WORKSPACE/combust-web-$VERSION.zip" . -x '.DS_Store'

      # Contents of backend/ (not the folder), never the server's .env.
      - name: Zip backend
        working-directory: backend
        run: zip -qr "$GITHUB_WORKSPACE/combust-backend-$VERSION.zip" . -x '.env' -x '*.DS_Store'

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            combust-web-${{ needs.check.outputs.version }}.zip
            combust-backend-${{ needs.check.outputs.version }}.zip
          if-no-files-found: error

  android:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Same major as Android Studio's bundled JBR, which builds the app locally.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Signing secrets are missing; an unsigned APK cannot be released."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/combust.jks
          {
            echo "storeFile=keystore/combust.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build
        env:
          COMBUST_API_URL: ${{ vars.COMBUST_API_URL }}
        run: |
          args=(:core:test :app:testDebugUnitTest :app:assembleRelease)
          [[ -n "$COMBUST_API_URL" ]] && args+=("-PcombustApiUrl=$COMBUST_API_URL")
          ./gradlew "${args[@]}"

      - name: Verify signing certificate
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          out="$("$apksigner" verify --print-certs "$apk" 2>&1)" || { echo "$out"; echo "::error::apksigner could not verify the APK"; exit 1; }
          echo "$out" | grep -v '^WARNING:'
          # The line's prefix varies by build-tools version ("Signer #1", "V2 Signer", …), so match on the tail.
          digest="$(echo "$out" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 \
            | tr 'A-F' 'a-f' | sed 's/../&:/g; s/:$//')"
          echo "APK certificate: $digest"
          if [[ "$digest" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK is signed by $digest, expected $EXPECTED_CERT_SHA256. Android would refuse it as an update."
            exit 1
          fi
          cp "$apk" "$GITHUB_WORKSPACE/combust-$VERSION.apk"

      - name: Remove signing key
        if: always()
        run: rm -rf keystore keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: combust-${{ needs.check.outputs.version }}.apk
          if-no-files-found: error

  release:
    needs: [check, web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum "combust-$VERSION.apk" "combust-web-$VERSION.zip" "combust-backend-$VERSION.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The body is the CHANGELOG section only: the Android update dialog shows it verbatim.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Combust $VERSION" \
            --notes-file changelog-section.md \
            "combust-$VERSION.apk" "combust-web-$VERSION.zip" "combust-backend-$VERSION.zip" SHA256SUMS.txt
